apiVersion: "qovery.com/v1"
kind: ServiceBlueprint

metadata:
  name: "cloudflare-workers"
  version: "1.0.1"
  description: "Deploy a Cloudflare Worker script (with an optional route) via the Cloudflare Terraform provider"
  icon: "app://qovery-console/cloudflare"
  serviceFamily: "workers"
  categories:
    - "edge"
    - "cloudflare"
    - "serverless"

spec:
  engine:
    type: terraform
    provider: CLOUDFLARE
    terraform:
      version: "1.9.7"
      allowedValues: ["1.9.7", "1.13.3"]
      overridable: true
    credentials:
      # Third-party SaaS: no cluster cloud credentials to reuse. Auth is the
      # cloudflare_api_token sensitive variable below.
      default: env
      allowedValues: ["env"]
      overridable: false
    backend:
      default: qovery
      allowedValues: ["qovery", "user_provided"]
      overridable: true
    timeout: 1800
    resources:
      cpu: "500m"
      ram: "512Mi"

  variables:
    - name: "cloudflare_api_token"
      type: "string"
      required: true
      sensitive: true
      description: "Cloudflare API token with Workers Scripts edit permission (and Workers Routes edit if using a route)"
    - name: "account_id"
      type: "string"
      required: true
      description: "Cloudflare account ID that owns the Worker"
    - name: "script_name"
      type: "string"
      required: true
      description: "Worker script name (lowercase letters, digits, hyphens, underscores)"
      pattern: "^[a-z0-9_-]+$"
    - name: "script_content"
      type: "string"
      required: false
      default: "addEventListener(\"fetch\", (event) => { event.respondWith(new Response(\"Hello from a Qovery-managed Cloudflare Worker\")); });"
      description: "Worker script source. Defaults to a hello-world service-worker script."
    - name: "main_module"
      type: "string"
      required: false
      default: ""
      description: "Entrypoint module name for ES-module Workers (e.g. worker.js). Empty = service-worker syntax."
    - name: "compatibility_date"
      type: "string"
      required: false
      default: "2024-09-23"
      description: "Cloudflare Workers runtime compatibility date (YYYY-MM-DD)"
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    - name: "route_zone_id"
      type: "string"
      required: false
      default: ""
      description: "Zone ID to attach a route on. Empty = no route."
    - name: "route_pattern"
      type: "string"
      required: false
      default: ""
      description: "Route pattern that triggers the Worker (e.g. example.com/*). Required when route_zone_id is set."

  outputs:
    - name: "script_name"
      description: "Deployed Worker script name"
    - name: "script_id"
      description: "Worker script ID"
    - name: "route_id"
      description: "Worker route ID (empty when no route is configured)"
    - name: "route_pattern"
      description: "URL pattern the Worker responds on (empty when no route is configured)"
