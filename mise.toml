[tools]

[tasks.generate-catalog]
description = "Generate catalog.json from committed blueprints (run this locally before pushing)"
run = """
cargo run --release --manifest-path tools/catalog-gen/Cargo.toml -- \
  generate --root . --output catalog.json
"""

# Deploy a PR's prerelease blueprint into a test environment. CI comments a ready-to-run
# invocation on every PR that touches a blueprint. Example:
#   QOVERY_API_TOKEN=... mise run deploy-service-rc <ENVIRONMENT_ID> AWS/postgres/17/3.1.0-pr45.abc1234-rc '{...}'
# The tag is passed separately and injected into the payload, so the JSON stays about the service
# config and there is only one place the tag can be wrong.
[tasks.deploy-service-rc]
description = "Create + deploy a blueprint service from an rc tag (use a TEST organization)"
usage = '''
arg "<environment_id>" help="Target environment uuid"
arg "<rc_tag>" help="Prerelease tag, e.g. AWS/postgres/17/3.1.0-pr45.abc1234-rc"
arg "<payload>" help="JSON body: name, icon, variables (tag is injected)"
'''
run = """
# `set -eu`, not `-o pipefail`: mise runs tasks with `sh`, which is dash on Debian/Ubuntu, and
# dash rejects pipefail with "Illegal option" before a single line executes.
set -eu
. "${MISE_CONFIG_ROOT:-.}/tools/qovery-api.sh"

ENVIRONMENT_ID="${usage_environment_id:-${1:-}}"
RC_TAG="${usage_rc_tag:-${2:-}}"
PAYLOAD="${usage_payload:-${3:-}}"
API="${QOVERY_API_URL:-https://api.qovery.com}"

if [ -z "$ENVIRONMENT_ID" ] || [ -z "$RC_TAG" ] || [ -z "$PAYLOAD" ]; then
  echo "usage: mise run deploy-service-rc <ENVIRONMENT_ID> <RC_TAG> '<json>'" >&2
  exit 2
fi
: "${QOVERY_API_TOKEN:?set QOVERY_API_TOKEN (Qovery API token for the target organization)}"

BODY="$(inject_tag "$RC_TAG" "$PAYLOAD")"
echo "POST ${API}/environment/${ENVIRONMENT_ID}/blueprint?deploy=true  (tag: ${RC_TAG})"
call_api -X POST "${API}/environment/${ENVIRONMENT_ID}/blueprint?deploy=true" \
  -H "Authorization: Bearer ${QOVERY_API_TOKEN}" \
  -H "Content-Type: application/json" \
  -d "$BODY"
"""

# Point an existing blueprint service at a PR's prerelease tag and redeploy it. Applies the
# update (PATCH) and then triggers the deployment; the preview diff is delivered over a
# websocket and is not reproducible from a shell, so it is skipped here. Example:
#   QOVERY_API_TOKEN=... mise run update-service-rc <BLUEPRINT_ID> AWS/postgres/17/3.1.0-pr45.abc1234-rc '{...}'
[tasks.update-service-rc]
description = "Point an existing blueprint service at an rc tag and redeploy (use a TEST organization)"
usage = '''
arg "<blueprint_id>" help="Blueprint uuid of the existing service"
arg "<rc_tag>" help="Prerelease tag, e.g. AWS/postgres/17/3.1.0-pr45.abc1234-rc"
arg "<payload>" help="JSON body: name, icon, variables patch map (tag is injected)"
'''
run = """
# `set -eu`, not `-o pipefail`: mise runs tasks with `sh`, which is dash on Debian/Ubuntu, and
# dash rejects pipefail with "Illegal option" before a single line executes.
set -eu
. "${MISE_CONFIG_ROOT:-.}/tools/qovery-api.sh"

BLUEPRINT_ID="${usage_blueprint_id:-${1:-}}"
RC_TAG="${usage_rc_tag:-${2:-}}"
PAYLOAD="${usage_payload:-${3:-}}"
API="${QOVERY_API_URL:-https://api.qovery.com}"

if [ -z "$BLUEPRINT_ID" ] || [ -z "$RC_TAG" ] || [ -z "$PAYLOAD" ]; then
  echo "usage: mise run update-service-rc <BLUEPRINT_ID> <RC_TAG> '<json>'" >&2
  exit 2
fi
: "${QOVERY_API_TOKEN:?set QOVERY_API_TOKEN (Qovery API token for the target organization)}"

cat >&2 <<WARN
WARNING: only ever point this at a disposable test service.
It pins the service to an rc tag that is deleted when the PR closes, and a service on a
deleted tag cannot be deployed.
WARN

BODY="$(inject_tag "$RC_TAG" "$PAYLOAD")"
echo "PATCH ${API}/blueprint/${BLUEPRINT_ID}  (tag: ${RC_TAG})"
call_api -X PATCH "${API}/blueprint/${BLUEPRINT_ID}" \
  -H "Authorization: Bearer ${QOVERY_API_TOKEN}" \
  -H "Content-Type: application/json" \
  -d "$BODY"

echo "POST ${API}/blueprint/${BLUEPRINT_ID}/deploy"
call_api -X POST "${API}/blueprint/${BLUEPRINT_ID}/deploy" \
  -H "Authorization: Bearer ${QOVERY_API_TOKEN}"
"""

# Fully retire a blueprint major: remove its directory, regenerate catalog.json,
# and delete its git tags + GitHub releases. Example:
#   mise run retire-blueprint HELM/redis/7
# DESTRUCTIVE: deleting the tags makes any Qovery service still pinned to one of
# them undeployable (the engine fetches qbm.yml/values.yaml from the catalog by
# tag). Dry-run by default; re-run with CONFIRM=yes to apply.
# The directory removal + catalog.json are only STAGED (never pushed to main) —
# commit them on a branch and open a PR. The tag/release deletions are ref ops
# applied immediately to the remote.
[tasks.retire-blueprint]
description = "Retire a blueprint major: remove dir + regen catalog + delete tags/releases (DESTRUCTIVE, dry-run unless CONFIRM=yes)"
usage = 'arg "<blueprint>" help="Blueprint path prefix, e.g. HELM/redis/7"'
run = """
set -euo pipefail
PREFIX="${usage_blueprint:-${1:-}}"
REMOTE="${REMOTE:-origin}"

if [ -z "$PREFIX" ]; then
  echo "usage: mise run retire-blueprint <PROVIDER/service/major>   (e.g. HELM/redis/7)" >&2
  exit 2
fi

DIR_STATE="not present"
[ -d "$PREFIX" ] && DIR_STATE="present (will be removed)"

# Authoritative tag list from the remote (local tags may be stale/missing). Strip peeled ^{} refs.
TAGS="$(git ls-remote --tags "$REMOTE" "refs/tags/${PREFIX}/*" \
  | sed 's#.*refs/tags/##; /\\^{}$/d' | sort -uV)"

echo "Retire blueprint: ${PREFIX}"
echo "  directory: ${DIR_STATE}"
echo "  tags on ${REMOTE}:"
if [ -n "$TAGS" ]; then echo "$TAGS" | sed 's/^/    /'; else echo "    (none)"; fi

if [ ! -d "$PREFIX" ] && [ -z "$TAGS" ]; then
  echo "Nothing to retire."
  exit 0
fi

if [ "${CONFIRM:-no}" != "yes" ]; then
  echo ""
  echo "DRY RUN. Would remove the directory (staged for a branch/PR), regenerate catalog.json,"
  echo "and delete the tags + GitHub releases on '${REMOTE}' and locally."
  echo "WARNING: deleting the tags makes any Qovery service still pinned to them FAIL to deploy."
  echo "First confirm nothing references them (q-core: SELECT * FROM blueprint WHERE tag LIKE '${PREFIX}/%'),"
  echo "migrate those services, then re-run: CONFIRM=yes mise run retire-blueprint ${PREFIX}"
  exit 0
fi

# 1. Remove the directory + regenerate catalog.json (repo content — staged, NOT pushed to main).
if [ -d "$PREFIX" ]; then
  git rm -r --quiet "$PREFIX"
  cargo run --release --manifest-path tools/catalog-gen/Cargo.toml -- generate --root . --output catalog.json
  git add catalog.json
  echo "removed ${PREFIX}/ and regenerated catalog.json (staged — commit on a branch and open a PR)"
fi

# 2. Delete tags + releases (ref ops applied immediately to the remote).
for t in $TAGS; do
  gh release delete "$t" --yes --cleanup-tag >/dev/null 2>&1 || true   # release + its remote tag
  git push "$REMOTE" --delete "$t" >/dev/null 2>&1 || true             # remote tag (if no release existed)
  git tag -d "$t" >/dev/null 2>&1 || true                             # local tag
  echo "deleted tag $t"
done
echo "Done. Commit the staged directory/catalog removal on a branch and open a PR."
"""
