apiVersion: "qovery.com/v1"
kind: ServiceBlueprint

metadata:
  name: "aws-elasticache-redis-node"
  displayName: "Amazon ElastiCache for Redis (legacy single node)"
  primaryCategory: "Databases & Caches"
  version: "1.0.0"
  description: "Adopts an existing single-node AWS ElastiCache for Redis cluster created by Qovery native managed Redis. Import only: it cannot create a new cluster. This shape has no auth token and no TLS."
  icon: "app://qovery-console/redis"
  serviceFamily: "redis"
  categories:
    - "database"
    - "cache"
    - "redis"
    - "elasticache"

spec:
  engine:
    type: terraform
    provider: AWS
    terraform:
      version: "1.9.7"
      # Pinned to 1.9+: catalog uses cross-variable validation elsewhere; kept aligned with AWS/redis.
      allowedValues: ["1.9.7", "1.13.3"]
      overridable: true
    credentials:
      default: cluster
      allowedValues: ["cluster", "env"]
      overridable: true
    backend:
      default: qovery
      allowedValues: ["qovery", "user_provided"]
      overridable: true
    timeout: 3600
    resources:
      cpu: "500m"
      ram: "512Mi"

  contextVariables:
    - name: "region"
      source: "cluster.region"
      overridable: true
    - name: "qovery_cluster_name"
      source: "cluster.name"
    - name: "qovery_cluster_id"
      source: "cluster.id"

  variables:
    - name: "redis_name"
      type: "string"
      required: true
      description: "Display name. Max 40 chars. Informational: the adopted cluster keeps its native tags."
      minLength: 1
      maxLength: 40
    - name: "engine_version"
      type: "string"
      required: false
      default: "7.0"
      description: "Redis engine version of the adopted cluster"
      allowedValues:
        - "7.0"
        - "7.1"
    - name: "instance_class"
      type: "string"
      required: true
      description: "ElastiCache node type of the adopted cluster"
      allowedValues:
        - "cache.c7gn.12xlarge"
        - "cache.c7gn.16xlarge"
        - "cache.c7gn.2xlarge"
        - "cache.c7gn.4xlarge"
        - "cache.c7gn.8xlarge"
        - "cache.c7gn.large"
        - "cache.c7gn.xlarge"
        - "cache.m4.10xlarge"
        - "cache.m4.2xlarge"
        - "cache.m4.4xlarge"
        - "cache.m4.large"
        - "cache.m4.xlarge"
        - "cache.m5.12xlarge"
        - "cache.m5.24xlarge"
        - "cache.m5.2xlarge"
        - "cache.m5.4xlarge"
        - "cache.m5.large"
        - "cache.m5.xlarge"
        - "cache.m6g.12xlarge"
        - "cache.m6g.16xlarge"
        - "cache.m6g.2xlarge"
        - "cache.m6g.4xlarge"
        - "cache.m6g.8xlarge"
        - "cache.m6g.large"
        - "cache.m6g.xlarge"
        - "cache.m7g.12xlarge"
        - "cache.m7g.16xlarge"
        - "cache.m7g.2xlarge"
        - "cache.m7g.4xlarge"
        - "cache.m7g.8xlarge"
        - "cache.m7g.large"
        - "cache.m7g.xlarge"
        - "cache.r4.16xlarge"
        - "cache.r4.2xlarge"
        - "cache.r4.4xlarge"
        - "cache.r4.8xlarge"
        - "cache.r4.large"
        - "cache.r4.xlarge"
        - "cache.r5.12xlarge"
        - "cache.r5.24xlarge"
        - "cache.r5.2xlarge"
        - "cache.r5.4xlarge"
        - "cache.r5.large"
        - "cache.r5.xlarge"
        - "cache.r6g.12xlarge"
        - "cache.r6g.16xlarge"
        - "cache.r6g.2xlarge"
        - "cache.r6g.4xlarge"
        - "cache.r6g.8xlarge"
        - "cache.r6g.large"
        - "cache.r6g.xlarge"
        - "cache.r7g.12xlarge"
        - "cache.r7g.16xlarge"
        - "cache.r7g.2xlarge"
        - "cache.r7g.4xlarge"
        - "cache.r7g.8xlarge"
        - "cache.r7g.large"
        - "cache.r7g.xlarge"
        - "cache.t3.medium"
        - "cache.t3.micro"
        - "cache.t3.small"
        - "cache.t4g.medium"
        - "cache.t4g.micro"
        - "cache.t4g.small"
    - name: "port"
      type: "number"
      required: false
      default: "6379"
      description: "Redis port"
      min: 1024
      max: 65535
    - name: "parameter_group_name"
      type: "string"
      required: true
      description: "Parameter group of the adopted cluster (native Qovery Redis uses default.redis7)."
    - name: "legacy_connection_username"
      type: "string"
      required: false
      description: "Leave empty — Qovery's migration sets it to the login held in the legacy connection variables. Not used for auth."
    - name: "legacy_connection_password"
      type: "string"
      required: false
      sensitive: true
      description: "Leave empty — Qovery's migration sets it to the password held in the legacy connection variables. Not used for auth: this shape has none."
    - name: "apply_changes_now"
      type: "bool"
      required: false
      default: "false"
      description: "Apply changes immediately instead of waiting for the next maintenance window"
    - name: "preferred_maintenance_window"
      type: "string"
      required: false
      default: "Tue:02:00-Tue:04:00"
      description: "Maintenance window (UTC), format ddd:hh24:mi-ddd:hh24:mi. Ignored after adoption, like the native template."
    - name: "preferred_backup_window"
      type: "string"
      required: false
      default: "00:00-01:00"
      description: "Daily snapshot window (UTC), format hh24:mi-hh24:mi. Only used when backup_retention_period > 0."
    - name: "backup_retention_period"
      type: "number"
      required: false
      default: "14"
      description: "Days to retain automatic snapshots (0 disables)"
      min: 0
      max: 35
    - name: "skip_final_snapshot"
      type: "bool"
      required: false
      default: "false"
      description: "Skip the final snapshot on deletion. False leaves a snapshot behind after the cluster is destroyed."

  outputs:
    - name: "redis_identifier"
      description: "ElastiCache cluster id (what the AWS console shows as the cluster name)"
    - name: "redis_host"
      description: "Hostname applications connect to"
    - name: "redis_port"
      description: "Redis port"
    - name: "redis_url"
      description: "Connection URL, plaintext with no auth (this shape supports neither)"
    - name: "redis_arn"
      description: "Cluster ARN"
    - name: "redis_engine_version_actual"
      description: "Engine version actually running"
    - name: "db_identifier"
      description: "Alias of redis_identifier"
    - name: "db_address"
      description: "Alias of redis_host"
    - name: "db_port"
      description: "Alias of redis_port"
    - name: "db_name"
      description: "Redis logical database applications use — always 0"
    - name: "db_username"
      description: "Legacy connection login, republished unchanged (not used for auth)"
    - name: "db_password"
      description: "Legacy connection password, republished unchanged (not used for auth)"
      sensitive: true
