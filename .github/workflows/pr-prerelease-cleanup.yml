name: Clean up PR prerelease tags

# validate.yml does not run on `closed`, so the cleanup lives in its own workflow.
# Without it every PR leaves its rc tags behind forever.
on:
  pull_request:
    types: [closed]

jobs:
  delete-prerelease-tags:
    name: Delete this PR's prerelease tags
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete remote rc tags for this PR
        run: |
          set -euo pipefail

          # Tags are {PROVIDER}/{service}/{major}/{version}-rc.{PR}.{short_sha}; match this PR only.
          SUFFIX="-rc.${{ github.event.pull_request.number }}."
          mapfile -t TAGS < <(git ls-remote --tags origin \
            | awk '{print $2}' \
            | sed 's|^refs/tags/||' \
            | grep -v '\^{}$' \
            | grep -F "$SUFFIX" || true)

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No prerelease tags to delete for PR #${{ github.event.pull_request.number }}."
            exit 0
          fi

          # Delete in one push so a single rejection fails the job. Without this the tags pile up
          # silently: the repo's "Only admins can delete tags" ruleset covers ~ALL tags with no
          # bypass actors, so unless it excludes the rc pattern, GITHUB_TOKEN cannot delete these.
          REFS=()
          for tag in "${TAGS[@]}"; do
            echo "Deleting $tag"
            REFS+=(":refs/tags/$tag")
          done

          if ! git push origin "${REFS[@]}"; then
            echo "::error::Could not delete prerelease tags. Check that the repository tag ruleset excludes the '-rc.' pattern."
            exit 1
          fi
