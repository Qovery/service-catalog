name: Clean up PR prerelease tags

# validate.yml does not run on `closed`, so the cleanup lives in its own workflow.
# Without it every PR leaves its rc tags behind forever.
on:
  pull_request:
    types: [closed]

jobs:
  delete-prerelease-tags:
    name: Delete this PR's prerelease tags
    runs-on: ubuntu-latest
    # Same gate as the job that creates the tags: only a branch on this repo ever gets them, so
    # only that case can have any to clean up. Deliberately not gated on author_association —
    # it reports MEMBER only for public org members, which would skip cleanup for nearly everyone
    # and leave the tags behind.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete remote rc tags for this PR
        run: |
          set -euo pipefail

          # Tags are {PROVIDER}/{service}/{major}/{version}-pr{PR}.{short_sha}-rc. Match this PR's
          # marker and require the -rc ending, which is what the ruleset exclusion keys on.
          MARKER="-pr${{ github.event.pull_request.number }}."
          mapfile -t TAGS < <(git ls-remote --tags origin \
            | awk '{print $2}' \
            | sed 's|^refs/tags/||' \
            | grep -v '\^{}$' \
            | grep -F "$MARKER" \
            | grep -E -- '-rc$' || true)

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No prerelease tags to delete for PR #${{ github.event.pull_request.number }}."
            exit 0
          fi

          # Delete in one push so a single rejection fails the job. Without this the tags pile up
          # silently: the repo's "Only admins can delete tags" ruleset covers ~ALL tags with no
          # bypass actors, and only excludes `refs/tags/**/*-rc` — so a tag whose last segment
          # does not end in `-rc` is undeletable by GITHUB_TOKEN.
          REFS=()
          for tag in "${TAGS[@]}"; do
            echo "Deleting $tag"
            REFS+=(":refs/tags/$tag")
          done

          if ! git push origin "${REFS[@]}"; then
            echo "::error::Could not delete prerelease tags. Check that the repository tag ruleset still excludes 'refs/tags/**/*-rc' from its deletion rule."
            exit 1
          fi
