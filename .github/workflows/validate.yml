name: Validate Blueprints

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-catalog-gen:
    name: Build catalog-gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build catalog-gen from the PR's own source so schema and validator stay in lockstep.
      # The published GHCR image lags by one merge (publish-catalog-gen runs on main only),
      # so pulling :latest would validate the PR against a stale binary.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/catalog-gen

      - name: Build
        working-directory: tools/catalog-gen
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-gen
          path: tools/catalog-gen/target/release/catalog-gen
          retention-days: 1
          if-no-files-found: error

  validate-qbm:
    name: Validate QBM manifests
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Validate QBM manifests and TF variable alignment
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen validate --root .

  discover-terraform-blueprints:
    name: Discover changed Terraform blueprints
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover
        name: List changed Terraform blueprint paths
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          PATHS="[]"
          for main_tf in $(find . -mindepth 4 -maxdepth 4 -name 'main.tf' -type f \
            -not -path './tools/*' \
            -not -path './.github/*' \
            -not -path './.git/*'); do
            dir=$(dirname "$main_tf" | sed 's|^\./||')
            if echo "$CHANGED_FILES" | grep -q "^${dir}/"; then
              PATHS=$(echo "$PATHS" | jq -c --arg p "$dir" '. += [$p]')
            fi
          done
          echo "matrix=$PATHS" >> $GITHUB_OUTPUT

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    needs: [discover-terraform-blueprints]
    if: ${{ needs.discover-terraform-blueprints.outputs.matrix != '[]' }}
    strategy:
      matrix:
        blueprint: ${{ fromJSON(needs.discover-terraform-blueprints.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform init & validate
        working-directory: ${{ matrix.blueprint }}
        run: |
          terraform init -backend=false
          terraform validate

  check-version-bump:
    name: Check version bump
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Check blueprint version bumps
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen check-version-bump --root . --base-ref origin/main

  auto-tag:
    name: Auto-tag changed blueprints
    runs-on: ubuntu-latest
    needs: [build-catalog-gen, validate-qbm, validate-terraform]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build-catalog-gen.result == 'success' &&
      needs.validate-qbm.result == 'success' &&
      (needs.validate-terraform.result == 'success' || needs.validate-terraform.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Create tags and releases for new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen auto-tag --root .

  pr-prerelease:
    name: Publish PR prerelease tags
    runs-on: ubuntu-latest
    needs: [build-catalog-gen, validate-qbm, validate-terraform, check-version-bump]
    # Only for branches on this repo: a fork PR gets a read-only GITHUB_TOKEN and cannot push tags.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build-catalog-gen.result == 'success' &&
      needs.validate-qbm.result == 'success' &&
      needs.check-version-bump.result == 'success' &&
      (needs.validate-terraform.result == 'success' || needs.validate-terraform.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Tag the author's own head commit, not the synthetic merge commit, so the deployed
      # blueprint is exactly what they pushed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - id: prerelease
        name: Tag changed blueprints with an rc suffix
        run: |
          chmod +x bin/catalog-gen
          # run_attempt keeps re-runs of the same PR from reusing a tag that already deployed.
          bin/catalog-gen prerelease \
            --root . \
            --base-ref origin/main \
            --suffix "rc.${{ github.event.pull_request.number }}.${{ github.run_attempt }}" \
            > tags.txt
          {
            echo 'tags<<TAGS_EOF'
            cat tags.txt
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment the deployable tags on the PR
        if: steps.prerelease.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.prerelease.outputs.tags }}
        run: |
          {
            echo "### Test these blueprints before merging"
            echo
            echo "Prerelease tags were pushed for this PR. Create or update a blueprint with one of"
            echo "them on a **test organization** — the engine clones the catalog by tag, so this"
            echo "deploys exactly what is on this branch."
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "These tags are deleted when the PR closes, and are never turned into a release."
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  check-catalog:
    name: Check catalog.json is up to date
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Generate catalog.json into temp file
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen generate --root . --output catalog.json.generated

      - name: Diff against committed catalog.json
        run: |
          jq 'del(.generatedAt)' catalog.json > catalog.json.norm
          jq 'del(.generatedAt)' catalog.json.generated > catalog.json.generated.norm
          if ! diff -u catalog.json.norm catalog.json.generated.norm; then
            echo ""
            echo "catalog.json is out of date. Run 'mise run generate-catalog' locally and commit the result."
            exit 1
          fi
          echo "catalog.json is up to date."
