name: Validate Blueprints

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-catalog-gen:
    name: Build catalog-gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build catalog-gen from the PR's own source so schema and validator stay in lockstep.
      # The published GHCR image lags by one merge (publish-catalog-gen runs on main only),
      # so pulling :latest would validate the PR against a stale binary.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/catalog-gen

      - name: Build
        working-directory: tools/catalog-gen
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-gen
          path: tools/catalog-gen/target/release/catalog-gen
          retention-days: 1
          if-no-files-found: error

  validate-qbm:
    name: Validate QBM manifests
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Validate QBM manifests and TF variable alignment
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen validate --root .

  discover-terraform-blueprints:
    name: Discover changed Terraform blueprints
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover
        name: List changed Terraform blueprint paths
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          PATHS="[]"
          for main_tf in $(find . -mindepth 4 -maxdepth 4 -name 'main.tf' -type f \
            -not -path './tools/*' \
            -not -path './.github/*' \
            -not -path './.git/*'); do
            dir=$(dirname "$main_tf" | sed 's|^\./||')
            if echo "$CHANGED_FILES" | grep -q "^${dir}/"; then
              PATHS=$(echo "$PATHS" | jq -c --arg p "$dir" '. += [$p]')
            fi
          done
          echo "matrix=$PATHS" >> $GITHUB_OUTPUT

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    needs: [discover-terraform-blueprints]
    if: ${{ needs.discover-terraform-blueprints.outputs.matrix != '[]' }}
    strategy:
      matrix:
        blueprint: ${{ fromJSON(needs.discover-terraform-blueprints.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform init & validate
        working-directory: ${{ matrix.blueprint }}
        run: |
          terraform init -backend=false
          terraform validate

  check-version-bump:
    name: Check version bump
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Check blueprint version bumps
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen check-version-bump --root . --base-ref origin/main

  auto-tag:
    name: Auto-tag changed blueprints
    runs-on: ubuntu-latest
    needs: [build-catalog-gen, validate-qbm, validate-terraform]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build-catalog-gen.result == 'success' &&
      needs.validate-qbm.result == 'success' &&
      (needs.validate-terraform.result == 'success' || needs.validate-terraform.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Create tags and releases for new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen auto-tag --root .

  pr-prerelease:
    name: Publish PR prerelease tags
    runs-on: ubuntu-latest
    needs:
      - build-catalog-gen
      - validate-qbm
      - discover-terraform-blueprints
      - validate-terraform
      - check-version-bump
      - check-catalog
    # The branch must live on this repo, which requires write access. The repo is public but has
    # no outside or direct collaborators — all write comes through Qovery org teams — so this is
    # equivalent to "the author is a Qovery org member". The first step below asserts that
    # invariant at runtime rather than trusting this comment.
    #
    # Do NOT gate on author_association: it only reports MEMBER for *public* org members (Qovery
    # has two), so it silently skips this job for nearly everyone. A fork PR is excluded by the
    # head-repo check, and its GITHUB_TOKEN is read-only regardless, so it could not push a tag.
    #
    # `validate-terraform` is skipped when no blueprint ships a main.tf, which is legitimate — but
    # only if discovery itself succeeded, hence discover-terraform-blueprints is required too.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build-catalog-gen.result == 'success' &&
      needs.validate-qbm.result == 'success' &&
      needs.check-version-bump.result == 'success' &&
      needs.check-catalog.result == 'success' &&
      needs.discover-terraform-blueprints.result == 'success' &&
      (needs.validate-terraform.result == 'success' || needs.validate-terraform.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Tag the author's own head commit, not the synthetic merge commit, so the deployed
      # blueprint is exactly what they pushed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      # The job's only access control is "the branch is on this repo", which equals org
      # membership solely because nobody outside the org has write here. Assert that rather than
      # assume it. Fails open if the endpoint is not readable by GITHUB_TOKEN — the point is to
      # catch the invariant being broken, not to add a new way for the job to break.
      - name: Assert no outside collaborators
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! OUTSIDE=$(gh api "repos/${{ github.repository }}/collaborators?affiliation=outside" --jq 'length' 2>/dev/null); then
            echo "::notice::Could not read the collaborator list; skipping the org-membership assertion."
            exit 0
          fi
          if [ "$OUTSIDE" -ne 0 ]; then
            echo "::error::This repo now has $OUTSIDE outside collaborator(s), so a branch on this repo no longer implies Qovery org membership. Gate this job on real membership before continuing."
            exit 1
          fi
          echo "No outside collaborators: push access still implies org membership."

      # Other jobs validate the synthetic merge commit; this job tags the head. Re-validate the
      # head so the tag cannot point at content that was never checked — they differ whenever
      # main changed a blueprint after this branch diverged.
      - name: Validate the head commit being tagged
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen validate --root .

      # Two runs race when pushes land close together, and the older must not delete the newer's
      # tags and comment. Fails open on an unreadable endpoint: this guards against clobbering a
      # newer run, it is not a health check.
      - id: guard
        name: Skip if a newer push superseded this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! CURRENT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha'); then
            echo "::notice::Could not read the PR head; proceeding."
            exit 0
          fi
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            echo "::notice::Head moved to ${CURRENT}; a newer run owns this PR's tags and comment."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - id: prerelease
        name: Tag changed blueprints with an rc suffix
        if: steps.guard.outputs.stale != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x bin/catalog-gen
          # The suffix carries the head SHA so a tag identifies its content: unique per commit,
          # idempotent across workflow re-runs, and never needing a force update — which the tag
          # ruleset forbids. It must END in `-rc`: the ruleset excludes `refs/tags/**/*-rc` from
          # its deletion rule, and fnmatch `*` does not cross `/`, so only a last segment ending
          # in `-rc` is deletable. catalog-gen enforces this.
          bin/catalog-gen prerelease \
            --root . \
            --base-ref origin/main \
            --suffix "pr${{ github.event.pull_request.number }}.${HEAD_SHA:0:7}-rc" \
            > blueprints.json
          {
            echo 'blueprints<<JSON_EOF'
            cat blueprints.json
            echo 'JSON_EOF'
          } >> "$GITHUB_OUTPUT"

      - id: comment
        name: Comment the deployable tags on the PR
        if: steps.prerelease.outputs.blueprints != '' && steps.guard.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLUEPRINTS: ${{ steps.prerelease.outputs.blueprints }}
        run: |
          {
            # Invisible when rendered. The next push's prune step keys on this to find the
            # comments it supersedes.
            echo "<!-- qovery-rc-prerelease -->"
            echo "### How to test this blueprint before merging"
            echo
            echo "**Use a test organization, never production.**"
            echo
            echo "Requirements:"
            echo
            echo "- \`QOVERY_API_TOKEN\` — a Qovery API token for the target organization. Either"
            echo "  export it, or set it inline on the command"
            echo "  (\`QOVERY_API_TOKEN=… mise run …\`) — both work."
            echo "- \`mise\`"
            echo "- \`jq\`"
            echo "- \`curl\`"
            echo
            echo "Payloads are pre-filled from this branch's \`qbm.yml\` — fill in the empty values."
          } > comment.md

          # Pretty-print a payload and shell-quote it: readable in the snippet, still safe to
          # paste. jq's @sh escapes an apostrophe from a manifest default as '\'', and preserves
          # the newlines, so the multi-line JSON stays a single shell argument.
          quote_payload() {
            jq -rn --arg s "$(sed '2,$s/^/  /')" '$s | @sh'
          }

          # One section per changed blueprint, rendered field-by-field rather than as one giant jq
          # expression so the three options stay readable.
          printf '%s' "$BLUEPRINTS" | jq -c '.[]' | while read -r bp; do
            DIR=$(jq -r '.dir' <<<"$bp")
            RC_TAG=$(jq -r '.tag' <<<"$bp")
            BASE_TAG=$(jq -r '.base_tag // empty' <<<"$bp")
            # Name derived from the blueprint path: a PR touching several blueprints would
            # otherwise emit the same service name for each, and the second create returns 409
            # (a service name must be unique within an environment).
            NAME=$(jq -r '"rc-" + (.dir | ascii_downcase | gsub("[^a-z0-9]+"; "-"))' <<<"$bp")
            # Create payloads take a list of variables; the update payload is a merge-patch map and
            # carries ONLY what this branch adds — resending existing keys would overwrite the
            # deployed values, and an empty required secret is rejected outright.
            CREATE_RC=$(jq --arg n "$NAME" '{name: $n, icon: .icon, variables: .variables}' <<<"$bp" | quote_payload)
            CREATE_BASE=$(jq --arg n "$NAME" '{name: $n, icon: .base_icon, variables: .base_variables}' <<<"$bp" | quote_payload)
            UPDATE=$(jq --arg n "$NAME" '{name: $n, icon: .icon, variables: (.update_variables | map({key: .name, value: ({value: .value} + (if .is_secret then {is_secret: true} else {} end))}) | from_entries)}' <<<"$bp" | quote_payload)

            echo
            echo "#### \`$DIR\` — \`$RC_TAG\`"
            echo
            echo "**1. Test a new deployment**"
            echo
            echo '```sh'
            echo "mise run deploy-service-rc \$ENVIRONMENT_ID \\"
            echo "  $RC_TAG \\"
            echo "  $CREATE_RC"
            echo '```'

            if [ -z "$BASE_TAG" ]; then
              echo
              echo "**2. Test a service update** — not applicable: this blueprint is new on this"
              echo "branch, so there is no published version to upgrade from."
              continue
            fi

            echo
            echo "**2. Test a service update**"
            echo
            echo "_a. Against an existing **test** service_"
            echo
            echo '```sh'
            echo "mise run update-service-rc \$BLUEPRINT_ID \\"
            echo "  $RC_TAG \\"
            echo "  $UPDATE"
            echo '```'
            echo
            echo "> **⚠️ Only ever point this at a disposable test service.**"
            echo "> It pins that service to an rc tag that is **deleted as soon as this PR is"
            echo "> pushed to again**, and a service on a deleted tag cannot be deployed. Re-run"
            echo "> the command above with the tag from the refreshed comment after each push — and"
            echo "> note that a push that stops changing this blueprint leaves no rc tag at all."
            echo
            echo "_b. Against a brand-new test service_ — create one on the published tag first, then"
            echo "run 2a against it. Starting from \`$BASE_TAG\` is what makes step 2 an actual"
            echo "upgrade; creating at the rc tag would diff against itself and show nothing."
            echo
            echo '```sh'
            echo "# i. create a throwaway service on the currently published tag"
            echo "mise run deploy-service-rc \$ENVIRONMENT_ID \\"
            echo "  $BASE_TAG \\"
            echo "  $CREATE_BASE"
            echo
            echo "# ii. then run 2a with the blueprint id it returns, and delete the service when done"
            echo '```'
          done >> comment.md

          {
            echo
            echo "Notes:"
            echo
            echo "- These blueprints do **not** appear in the Console picker — it lists"
            echo "  \`catalog.json\` from \`main\`, which has no rc tags. This is an API-only flow."
            echo "- Option 1 exercises provisioning from scratch. Option 2 exercises the migration"
            echo "  path (the diff runs against the deployed service's terraform state), which is"
            echo "  what reveals a change that would replace or destroy live infrastructure."
            echo "- These tags never become releases. Each push replaces this comment and deletes"
            echo "  the tags of the previous push, so only the tags above exist; closing the PR"
            echo "  deletes those too."
          } >> comment.md

          # Post before pruning, so there is never a window where the PR carries no instructions.
          # The prune step needs the new comment's id to know which one to keep.
          COMMENT_URL=$(gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md)
          echo "$COMMENT_URL"
          NEW_ID=$(printf '%s' "$COMMENT_URL" | sed -n 's/.*#issuecomment-\([0-9]\{1,\}\).*/\1/p')
          echo "comment_id=$NEW_ID" >> "$GITHUB_OUTPUT"

      # Not gated on `blueprints`: a push that stops changing them emits none, and the previous
      # comment must still go. Gated on the comment step not having failed — with no replacement
      # posted, the old comments are the only instructions there are.
      - id: prune_comments
        name: Delete this PR's superseded rc comments
        if: ${{ !cancelled() && steps.guard.outputs.stale != 'true' && steps.prerelease.outcome == 'success' && steps.comment.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_OUTCOME: ${{ steps.comment.outcome }}
          KEEP_ID: ${{ steps.comment.outputs.comment_id }}
        run: |
          set -euo pipefail

          # The guard ran before tagging and commenting; a push can have landed since. Re-check here,
          # immediately before deleting, and fail open on an unreadable endpoint as the guard does.
          CURRENT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha' || echo "$HEAD_SHA")
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            echo "::notice::Head moved to ${CURRENT}; leaving this PR's comments to the newer run."
            exit 0
          fi

          # An empty KEEP_ID is expected when the step above was skipped — then every comment goes.
          # But if it ran and the URL did not parse, we cannot tell the new comment from the old
          # ones: leave a duplicate rather than risk deleting the only copy of the instructions.
          if [ "$COMMENT_OUTCOME" = "success" ] && [ -z "$KEEP_ID" ]; then
            echo "::warning::Could not determine the new comment's id; leaving previous comments in place."
            exit 0
          fi

          # Also match the header: comments posted before the marker existed carry none.
          # Captured rather than piped: a failed listing is not evidence of nothing to prune.
          if ! RAW=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq '
              .[] | select(.user.login == "github-actions[bot]")
                  | select(.body | contains("<!-- qovery-rc-prerelease -->")
                           or contains("### How to test this blueprint before merging"))
                  | .id'); then
            echo "::warning::Could not list PR comments; leaving previous comments in place."
            exit 0
          fi

          while IFS= read -r id; do
            [ -n "$id" ] && [ "$id" != "$KEEP_ID" ] || continue
            echo "Deleting superseded comment $id"
            # A comment someone already deleted by hand answers 404. That is the desired end state,
            # so warn rather than fail the job over it.
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$id" \
              || echo "::warning::Could not delete comment $id."
          done <<< "$RAW"

      # Last: only once the new tags are pushed AND the comment state is known good. If the comment
      # did not reconcile, the comment still on the PR names the previous generation, so deleting it
      # would leave the PR advertising tags that no longer exist. Stranded tags go at PR close.
      - name: Delete this PR's superseded rc tags
        if: ${{ !cancelled() && steps.guard.outputs.stale != 'true' && steps.prerelease.outcome == 'success' && steps.prune_comments.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Re-check ownership immediately before deleting, as the comment prune does.
          CURRENT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha' || echo "$HEAD_SHA")
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            echo "::notice::Head moved to ${CURRENT}; leaving this PR's tags to the newer run."
            exit 0
          fi

          .github/scripts/delete-pr-rc-tags.sh \
            "${{ github.event.pull_request.number }}" \
            "-pr${{ github.event.pull_request.number }}.${HEAD_SHA:0:7}-rc"

  check-catalog:
    name: Check catalog.json is up to date
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Generate catalog.json into temp file
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen generate --root . --output catalog.json.generated

      - name: Diff against committed catalog.json
        run: |
          jq 'del(.generatedAt)' catalog.json > catalog.json.norm
          jq 'del(.generatedAt)' catalog.json.generated > catalog.json.generated.norm
          if ! diff -u catalog.json.norm catalog.json.generated.norm; then
            echo ""
            echo "catalog.json is out of date. Run 'mise run generate-catalog' locally and commit the result."
            exit 1
          fi
          echo "catalog.json is up to date."
