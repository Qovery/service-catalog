name: Validate Blueprints

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-catalog-gen:
    name: Build catalog-gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build catalog-gen from the PR's own source so schema and validator stay in lockstep.
      # The published GHCR image lags by one merge (publish-catalog-gen runs on main only),
      # so pulling :latest would validate the PR against a stale binary.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/catalog-gen

      - name: Build
        working-directory: tools/catalog-gen
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-gen
          path: tools/catalog-gen/target/release/catalog-gen
          retention-days: 1
          if-no-files-found: error

  validate-qbm:
    name: Validate QBM manifests
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Validate QBM manifests and TF variable alignment
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen validate --root .

  discover-terraform-blueprints:
    name: Discover changed Terraform blueprints
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover
        name: List changed Terraform blueprint paths
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          PATHS="[]"
          for main_tf in $(find . -mindepth 4 -maxdepth 4 -name 'main.tf' -type f \
            -not -path './tools/*' \
            -not -path './.github/*' \
            -not -path './.git/*'); do
            dir=$(dirname "$main_tf" | sed 's|^\./||')
            if echo "$CHANGED_FILES" | grep -q "^${dir}/"; then
              PATHS=$(echo "$PATHS" | jq -c --arg p "$dir" '. += [$p]')
            fi
          done
          echo "matrix=$PATHS" >> $GITHUB_OUTPUT

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    needs: [discover-terraform-blueprints]
    if: ${{ needs.discover-terraform-blueprints.outputs.matrix != '[]' }}
    strategy:
      matrix:
        blueprint: ${{ fromJSON(needs.discover-terraform-blueprints.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform init & validate
        working-directory: ${{ matrix.blueprint }}
        run: |
          terraform init -backend=false
          terraform validate

  check-version-bump:
    name: Check version bump
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Check blueprint version bumps
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen check-version-bump --root . --base-ref origin/main

  auto-tag:
    name: Auto-tag changed blueprints
    runs-on: ubuntu-latest
    needs: [build-catalog-gen, validate-qbm, validate-terraform]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build-catalog-gen.result == 'success' &&
      needs.validate-qbm.result == 'success' &&
      (needs.validate-terraform.result == 'success' || needs.validate-terraform.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Create tags and releases for new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen auto-tag --root .

  pr-prerelease:
    name: Publish PR prerelease tags
    runs-on: ubuntu-latest
    needs: [build-catalog-gen, validate-qbm, validate-terraform, check-version-bump]
    # Restricted twice over. The branch must live on this repo (a fork PR gets a read-only
    # GITHUB_TOKEN and could not push tags anyway), AND the author must be a Qovery org member or
    # owner. author_association is COLLABORATOR for an outside collaborator with write access, so
    # checking it — not just push permission — is what limits this to the organization.
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association) &&
      needs.build-catalog-gen.result == 'success' &&
      needs.validate-qbm.result == 'success' &&
      needs.check-version-bump.result == 'success' &&
      (needs.validate-terraform.result == 'success' || needs.validate-terraform.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Tag the author's own head commit, not the synthetic merge commit, so the deployed
      # blueprint is exactly what they pushed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - id: prerelease
        name: Tag changed blueprints with an rc suffix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x bin/catalog-gen
          # The suffix carries the head SHA so a tag identifies its content: unique per commit,
          # idempotent across workflow re-runs, and never needing a force update — which the tag
          # ruleset forbids. It must END in `-rc`: the ruleset excludes `refs/tags/**/*-rc` from
          # its deletion rule, and fnmatch `*` does not cross `/`, so only a last segment ending
          # in `-rc` is deletable. catalog-gen enforces this.
          bin/catalog-gen prerelease \
            --root . \
            --base-ref origin/main \
            --suffix "pr${{ github.event.pull_request.number }}.${HEAD_SHA:0:7}-rc" \
            > blueprints.json
          {
            echo 'blueprints<<JSON_EOF'
            cat blueprints.json
            echo 'JSON_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment the deployable tags on the PR
        if: steps.prerelease.outputs.blueprints != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLUEPRINTS: ${{ steps.prerelease.outputs.blueprints }}
        run: |
          {
            echo "### Test this blueprint before merging"
            echo
            echo "The engine clones the catalog by git tag, so deploying one of these runs exactly"
            echo "what is on this branch. Use a **test organization**, not production."
            echo
            echo "Requires \`QOVERY_API_TOKEN\` in your environment, and \`mise\` + \`jq\`."
            echo "Values below are this branch's required variables — fill in the empty ones."
          } > comment.md

          # Render one block per changed blueprint. The payload carries name/icon/variables; the
          # tag is a separate argument the task injects, so it cannot drift from the JSON.
          printf '%s' "$BLUEPRINTS" | jq -r '
            .[] |
            "\n#### `\(.dir)`\n\n```sh\n" +
            "# new service\n" +
            "mise run deploy-service-rc $ENVIRONMENT_ID \\\n  \(.tag) \\\n  " +
            ({name: "rc-test", icon: .icon, variables: .variables} | @json | @sh) +
            "\n\n# existing blueprint service\n" +
            "mise run update-service-rc $BLUEPRINT_ID \\\n  \(.tag) \\\n  " +
            ({name: "rc-test", icon: .icon, variables: (.variables | map({key: .name, value: ({value: .value} + (if .is_secret then {is_secret: true} else {} end))}) | from_entries)} | @json | @sh) +
            "\n```"
          ' >> comment.md

          {
            echo
            echo "Two things to know:"
            echo
            echo "- These blueprints do **not** appear in the Console picker. It lists \`catalog.json\`"
            echo "  from \`main\`, which has no rc tags — so this is an API-only flow."
            echo "- \`deploy-service-rc\` takes variables as a **list**, \`update-service-rc\` as a"
            echo "  **patch map** (\`null\` removes a variable). Both are pre-rendered above."
            echo
            echo "These tags are never turned into a release, and are deleted when the PR closes."
          } >> comment.md

          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

  check-catalog:
    name: Check catalog.json is up to date
    runs-on: ubuntu-latest
    needs: [build-catalog-gen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: catalog-gen
          path: bin

      - name: Generate catalog.json into temp file
        run: |
          chmod +x bin/catalog-gen
          bin/catalog-gen generate --root . --output catalog.json.generated

      - name: Diff against committed catalog.json
        run: |
          jq 'del(.generatedAt)' catalog.json > catalog.json.norm
          jq 'del(.generatedAt)' catalog.json.generated > catalog.json.generated.norm
          if ! diff -u catalog.json.norm catalog.json.generated.norm; then
            echo ""
            echo "catalog.json is out of date. Run 'mise run generate-catalog' locally and commit the result."
            exit 1
          fi
          echo "catalog.json is up to date."
