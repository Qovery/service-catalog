# Datadog Agent chart values. Secrets and toggles are interpolated by Qovery.
datadog:
  apiKey: {{ datadog_api_key }}
  site: {{ datadog_site }}
  clusterName: {{ cluster_name }}
  logs:
    enabled: {{ enable_logs }}
    containerCollectAll: {{ enable_logs }}
  apm:
    portEnabled: {{ enable_apm }}
  # Chart 3.240.0 defaults this to true, which ships the Datadog Operator and 7 cluster-scoped
  # CRDs. CRDs are singular per cluster, so the first environment to install owns them and every
  # later install on the same cluster fails on Helm ownership. The agent is deployed directly by
  # this chart, so the Operator is unused.
  operator:
    enabled: false

# Per-node agent DaemonSet — resources explicitly set (don't rely on chart defaults).
agents:
  containers:
    agent:
      resources:
        requests:
          cpu: "200m"
          memory: "{{ agent_memory }}"
        limits:
          memory: "{{ agent_memory }}"

# Cluster agent (cluster-level metrics, orchestrator, external metrics).
clusterAgent:
  # The chart names this component's Service "<release>-cluster-agent-admission-controller". Qovery
  # release names are "helm-z<id>-<service name>", leaving 13 characters for the service name before
  # the Service exceeds Kubernetes' 63-character limit and the deploy fails. Nothing is lost: the
  # controller only injects APM/DogStatsD config into pods labelled admission.datadoghq.com/enabled,
  # which Qovery services do not carry, and it also claims a cluster-wide "datadog-webhook" object
  # that a second install in another namespace would fight over.
  admissionController:
    enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "256Mi"
