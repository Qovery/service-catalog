apiVersion: "qovery.com/v1"
kind: ServiceBlueprint

metadata:
  name: "helm-datadog"
  version: "2.0.0"
  description: "Datadog Agent (metrics, logs, optional APM) on Kubernetes via the official Datadog Helm chart"
  icon: "app://qovery-console/datadog"
  serviceFamily: "datadog"
  categories:
    - "monitoring"
    - "observability"
    - "datadog"

spec:
  engine:
    type: helm
    chart:
      repository: "https://helm.datadoghq.com"
      name: "datadog"
      version: "3.240.0"
    arguments: []
    # Datadog deploys a per-node DaemonSet plus ClusterRole/ClusterRoleBinding and a
    # cluster agent — all cluster-scoped resources.
    allowClusterWideResources: true

  variables:
    - name: "datadog_api_key"
      type: "string"
      required: true
      sensitive: true
      description: "Datadog API key (Organization Settings → API Keys)"
    - name: "datadog_site"
      type: "string"
      required: true
      default: "datadoghq.com"
      description: "Datadog site your account belongs to"
      allowedValues:
        - "datadoghq.com"
        - "us3.datadoghq.com"
        - "us5.datadoghq.com"
        - "datadoghq.eu"
        - "ap1.datadoghq.com"
        - "ddog-gov.com"
    - name: "cluster_name"
      type: "string"
      required: false
      description: "Cluster name tag applied to all Datadog telemetry. Leave empty to use the Qovery cluster's own name, lowercased and hyphenated. Otherwise: lowercase letters, digits, hyphens and underscores, optionally dot-separated, starting and ending alphanumeric (e.g. prod-eu)"
      maxLength: 80
      # Mirrors the chart's own check-cluster-name check (80 chars, FQDN-like tokens of
      # [a-z0-9_-]) so nothing Datadog accepts is rejected here. Wrapped optional because an
      # untouched optional field arrives as "" rather than being omitted, and the platform
      # validates a submitted "" while skipping a variable that is absent entirely — rejecting ""
      # would fail the create request before values.yaml can fall back to the cluster's name.
      pattern: "^(([a-z0-9]([a-z0-9_-]*[a-z0-9])?[.])*([a-z0-9]([a-z0-9_-]*[a-z0-9])?))?$"
    - name: "enable_logs"
      type: "string"
      required: false
      default: "true"
      description: "Collect container logs from all pods"
      allowedValues:
        - "true"
        - "false"
    - name: "enable_apm"
      type: "string"
      required: false
      default: "false"
      description: "Enable the APM trace-agent port for application tracing"
      allowedValues:
        - "true"
        - "false"
    - name: "agent_memory"
      type: "string"
      required: false
      default: "512Mi"
      description: "Memory request/limit for the node agent container (valid Kubernetes quantity)"
      pattern: "^[0-9]+(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K|m)?$"
    - name: "cluster_agent_memory"
      type: "string"
      required: false
      default: "512Mi"
      description: "Memory request/limit for the cluster agent container (valid Kubernetes quantity)"
      pattern: "^[0-9]+(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K|m)?$"

  outputs:
    - name: "datadog_cluster_agent_service"
      description: "In-cluster Datadog cluster-agent service name"
      sensitive: false
