# Grafana chart values. User inputs are interpolated by Qovery (Tera).
#
# The platform sends only the variables the client supplied: an optional left alone arrives
# undefined (or as ""), and interpolating it bare aborts the whole render. Every optional is
# therefore resolved once here, falling back to the qbm.yml default. `if` rather than the
# `default` filter, because `default` covers undefined only and clients also send "".
{% if admin_user %}{% set admin_user_v = admin_user %}{% else %}{% set admin_user_v = "admin" %}{% endif %}
{%- if root_url %}{% set root_url_v = root_url %}{% else %}{% set root_url_v = "" %}{% endif %}
{%- if anonymous_access %}{% set anonymous_access_v = anonymous_access %}{% else %}{% set anonymous_access_v = "false" %}{% endif %}
{%- if metrics_url %}{% set metrics_url_v = metrics_url %}{% else %}{% set metrics_url_v = "http://thanos-query.prometheus.svc.cluster.local:9090" %}{% endif %}
{%- if prometheus_url %}{% set prometheus_url_v = prometheus_url %}{% else %}{% set prometheus_url_v = "http://prometheus-operated.prometheus.svc.cluster.local:9090" %}{% endif %}
{%- if loki_url %}{% set loki_url_v = loki_url %}{% else %}{% set loki_url_v = "http://loki.logging.svc.cluster.local:3100" %}{% endif %}
{%- if alertmanager_url %}{% set alertmanager_url_v = alertmanager_url %}{% else %}{% set alertmanager_url_v = "http://alertmanager-operated.prometheus.svc.cluster.local:9093" %}{% endif %}
{%- if default_datasource %}{% set default_datasource_v = default_datasource %}{% else %}{% set default_datasource_v = "thanos" %}{% endif %}
{%- if enable_prometheus_datasource %}{% set enable_prometheus_v = enable_prometheus_datasource %}{% else %}{% set enable_prometheus_v = "true" %}{% endif %}
{%- if enable_loki_datasource %}{% set enable_loki_v = enable_loki_datasource %}{% else %}{% set enable_loki_v = "true" %}{% endif %}
{%- if enable_alertmanager_datasource %}{% set enable_alertmanager_v = enable_alertmanager_datasource %}{% else %}{% set enable_alertmanager_v = "true" %}{% endif %}
{%- if scrape_interval %}{% set scrape_interval_v = scrape_interval %}{% else %}{% set scrape_interval_v = "30s" %}{% endif %}
{%- if loki_max_lines %}{% set loki_max_lines_v = loki_max_lines %}{% else %}{% set loki_max_lines_v = "5000" %}{% endif %}
{%- if kubernetes_dashboards %}{% set kubernetes_dashboards_v = kubernetes_dashboards %}{% else %}{% set kubernetes_dashboards_v = "true" %}{% endif %}
{%- if dashboards_folder %}{% set dashboards_folder_v = dashboards_folder %}{% else %}{% set dashboards_folder_v = "Kubernetes" %}{% endif %}
{%- if extra_dashboards %}{% set extra_dashboards_v = extra_dashboards %}{% else %}{% set extra_dashboards_v = "" %}{% endif %}
{%- if plugins %}{% set plugins_v = plugins %}{% else %}{% set plugins_v = "" %}{% endif %}
{%- if default_theme %}{% set default_theme_v = default_theme %}{% else %}{% set default_theme_v = "system" %}{% endif %}
{%- if default_timezone %}{% set default_timezone_v = default_timezone %}{% else %}{% set default_timezone_v = "browser" %}{% endif %}
{%- if log_level %}{% set log_level_v = log_level %}{% else %}{% set log_level_v = "info" %}{% endif %}
{%- if persistence %}{% set persistence_v = persistence %}{% else %}{% set persistence_v = "true" %}{% endif %}
{%- if storage_size %}{% set storage_size_v = storage_size %}{% else %}{% set storage_size_v = "10Gi" %}{% endif %}
{%- if storage_class %}{% set storage_class_v = storage_class %}{% else %}{% set storage_class_v = "" %}{% endif %}
{%- if cpu_request %}{% set cpu_request_v = cpu_request %}{% else %}{% set cpu_request_v = "100m" %}{% endif %}
{%- if memory %}{% set memory_v = memory %}{% else %}{% set memory_v = "512Mi" %}{% endif %}
{%- set dashboards_on = kubernetes_dashboards_v == "true" or extra_dashboards_v != "" %}
{#- The provider is keyed on the folder: Grafana does not move a provisioned dashboard when only
    its provider's folder changes, but it does drop the dashboards of a provider that is gone. #}
{%- set provider = "b-" ~ dashboards_folder_v | slugify %}

# A stable Service name ("grafana") whatever the Qovery service is called, so port-forwards and
# in-cluster links do not depend on the helm-z<id>-<name> release name.
fullnameOverride: "grafana"

adminUser: "{{ admin_user_v }}"
# json_encode emits a double-quoted string with JSON escapes, which is also a valid YAML
# double-quoted scalar: a password containing `"` or `\` cannot break out of the value.
adminPassword: {{ admin_password | json_encode() }}

# One replica only: Grafana's embedded SQLite database lives on a ReadWriteOnce volume.
replicas: 1

# Keep RBAC in the service namespace; the blueprint does not request cluster-wide resources.
rbac:
  namespaced: true

# The data volume is ReadWriteOnce: a rolling update would start the new pod while the old one
# still holds the volume, and the new pod would wait on a multi-attach error forever.
deploymentStrategy:
  type: Recreate

persistence:
  enabled: {% if persistence_v == "true" %}true{% else %}false{% endif %}
  type: pvc
  size: "{{ storage_size_v }}"
{%- if storage_class_v %}
  storageClassName: "{{ storage_class_v }}"
{%- endif %}

resources:
  requests:
    cpu: "{{ cpu_request_v }}"
    memory: "{{ memory_v }}"
  limits:
    memory: "{{ memory_v }}"

# The chart's test pod only runs under `helm test`, which Qovery never calls.
testFramework:
  enabled: false
{%- if plugins_v %}

plugins:
{%- for plugin in plugins_v | split(pat=",") %}
  - "{{ plugin | trim }}"
{%- endfor %}
{%- endif %}

grafana.ini:
  server:
{%- if root_url_v %}
    root_url: {{ root_url_v | json_encode() }}
    serve_from_sub_path: true
{%- endif %}
  log:
    level: "{{ log_level_v }}"
  users:
    allow_sign_up: false
    default_theme: "{{ default_theme_v }}"
  date_formats:
    default_timezone: "{{ default_timezone_v }}"
  auth.anonymous:
    enabled: {% if anonymous_access_v == "true" %}true{% else %}false{% endif %}
    org_role: "Viewer"
  analytics:
    reporting_enabled: false
    check_for_updates: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Thanos answers the same PromQL as Prometheus, with the long-term history.
      - name: "Thanos"
        uid: "thanos"
        type: "prometheus"
        access: "proxy"
        url: {{ metrics_url_v | json_encode() }}
        isDefault: {% if default_datasource_v == "thanos" or enable_prometheus_v != "true" %}true{% else %}false{% endif %}
        jsonData:
          timeInterval: "{{ scrape_interval_v }}"
{%- if enable_prometheus_v == "true" %}
      - name: "Prometheus"
        uid: "prometheus"
        type: "prometheus"
        access: "proxy"
        url: {{ prometheus_url_v | json_encode() }}
        isDefault: {% if default_datasource_v == "prometheus" %}true{% else %}false{% endif %}
        jsonData:
          timeInterval: "{{ scrape_interval_v }}"
{%- endif %}
{%- if enable_loki_v == "true" %}
      - name: "Loki"
        uid: "loki"
        type: "loki"
        access: "proxy"
        url: {{ loki_url_v | json_encode() }}
        jsonData:
          maxLines: {{ loki_max_lines_v }}
{%- endif %}
{%- if enable_alertmanager_v == "true" %}
      - name: "Alertmanager"
        uid: "alertmanager"
        type: "alertmanager"
        access: "proxy"
        url: {{ alertmanager_url_v | json_encode() }}
        jsonData:
          implementation: "prometheus"
{%- endif %}
{%- if enable_prometheus_v != "true" or enable_loki_v != "true" or enable_alertmanager_v != "true" %}
    # Provisioning only adds and updates: a datasource dropped from the list above stays in
    # Grafana's database unless it is deleted explicitly.
    deleteDatasources:
{%- if enable_prometheus_v != "true" %}
      - name: "Prometheus"
        orgId: 1
{%- endif %}
{%- if enable_loki_v != "true" %}
      - name: "Loki"
        orgId: 1
{%- endif %}
{%- if enable_alertmanager_v != "true" %}
      - name: "Alertmanager"
        orgId: 1
{%- endif %}
{%- endif %}

# Runs after the chart's init containers, on the data volume, before Grafana starts:
# - adminPassword only seeds the admin account on the very first start. Afterwards Grafana keeps
#   the password in its database, so a password changed in the Qovery form would be ignored.
#   `grafana cli admin reset-admin-password` writes it into the database on every start.
# - Downloaded dashboards are files on the data volume. A dashboard removed from the form, or a
#   renamed folder, would leave its file behind and Grafana would keep provisioning it.
# The plain image, not the chart's -distroless one: this needs a shell. Keep the tag on the chart's
# appVersion.
extraInitContainers:
  - name: blueprint-maintenance
    image: "docker.io/grafana/grafana:13.2.2"
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        if [ -f /var/lib/grafana/grafana.db ]; then
          printf '%s' "$GF_SECURITY_ADMIN_PASSWORD" \
            | grafana cli --homepath /usr/share/grafana admin reset-admin-password --password-from-stdin >/dev/null
          echo "admin password applied"
        fi
        if [ -d /var/lib/grafana/dashboards ]; then
          cd /var/lib/grafana/dashboards
          for dir in */; do
            [ -d "$dir" ] || continue
            dir="${dir%/}"
{%- if dashboards_on %}
            if [ "$dir" != "{{ provider }}" ]; then rm -rf "$dir"; echo "removed stale dashboards: $dir"; continue; fi
            for file in "$dir"/*.json; do
              [ -e "$file" ] || continue
              case "$(basename "$file" .json)" in
{%- if kubernetes_dashboards_v == "true" %}
                k8s-views-global|k8s-views-namespaces|k8s-views-nodes|k8s-views-pods|node-exporter-full) ;;
{%- if enable_loki_v == "true" %}
                loki-logs) ;;
{%- endif %}
{%- endif %}
{%- if extra_dashboards_v %}
{%- for entry in extra_dashboards_v | split(pat=",") %}
{%- set parts = entry | trim | split(pat=":") %}
                extra-{{ parts[0] }}) ;;
{%- endfor %}
{%- endif %}
                *) rm -f "$file"; echo "removed stale dashboard: $file" ;;
              esac
            done
{%- else %}
            rm -rf "$dir"; echo "removed stale dashboards: $dir"
{%- endif %}
          done
        fi
    env:
      - name: GF_SECURITY_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: "grafana"
            key: "admin-password"
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        memory: "256Mi"
    volumeMounts:
      - name: storage
        mountPath: /var/lib/grafana
{%- if dashboards_on %}

# The chart's default is `-skf`: one dashboard grafana.com cannot serve (a mistyped id or
# revision) fails the init container and Grafana never starts. Without -f the bad download is
# written as an error body, and Grafana logs that one dashboard as invalid and starts.
defaultCurlOptions: "-sk --retry 3 --retry-delay 2"
# The download script runs under `set -eufo pipefail` by default, so a connection-level failure
# (DNS, timeout, reset: what a grafana.com outage looks like) still aborts it even without -f.
# Without -e and pipefail every dashboard download is independent: a failed one leaves an empty
# or error file that Grafana skips, and the init container always completes.
defaultShellOptions: "uf"

# The chart downloads these from grafana.com in an init container. `datasource` fills each
# dashboard's datasource input; the preloaded ones are built for kube-prometheus-stack metrics,
# which is what Qovery installs.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "{{ provider }}"
        folder: "{{ dashboards_folder_v }}"
        type: "file"
        disableDeletion: false
        editable: true
        options:
          path: "/var/lib/grafana/dashboards/{{ provider }}"

dashboards:
  {{ provider }}:
{%- if kubernetes_dashboards_v == "true" %}
    k8s-views-global:
      gnetId: 15757
      revision: 43
      datasource: "Thanos"
    k8s-views-namespaces:
      gnetId: 15758
      revision: 42
      datasource: "Thanos"
    k8s-views-nodes:
      gnetId: 15759
      revision: 37
      datasource: "Thanos"
    k8s-views-pods:
      gnetId: 15760
      revision: 36
      datasource: "Thanos"
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource: "Thanos"
{%- if enable_loki_v == "true" %}
    loki-logs:
      gnetId: 13639
      revision: 2
      datasource: "Loki"
{%- endif %}
{%- endif %}
{%- if extra_dashboards_v %}
{%- for entry in extra_dashboards_v | split(pat=",") %}
{%- set parts = entry | trim | split(pat=":") %}
    extra-{{ parts[0] }}:
      gnetId: {{ parts[0] }}
      revision: {{ parts[1] }}
      datasource: "{% if default_datasource_v == "prometheus" and enable_prometheus_v == "true" %}Prometheus{% else %}Thanos{% endif %}"
{%- endfor %}
{%- endif %}
{%- endif %}
