apiVersion: "qovery.com/v1"
kind: ServiceBlueprint

metadata:
  name: "scaleway-mysql"
  displayName: "Scaleway MySQL"
  primaryCategory: "Databases & Caches"
  version: "1.5.2"
  description: "Scaleway Managed Database MySQL instance with configurable node type, storage, backups, and network ACL"
  icon: "app://qovery-console/mysql"
  serviceFamily: "mysql"
  categories:
    - "database"
    - "mysql"
    - "scaleway"

spec:
  engine:
    type: terraform
    provider: SCW
    terraform:
      version: "1.9.7"
      # variable validation, which requires TF 1.9+.
      allowedValues: ["1.9.7", "1.13.3"]
      overridable: true
    credentials:
      default: cluster
      allowedValues: ["cluster", "env"]
      overridable: true
    backend:
      default: qovery
      allowedValues: ["qovery", "user_provided"]
      overridable: true
    timeout: 3600
    resources:
      cpu: "500m"
      ram: "512Mi"

  contextVariables:
    - name: "region"
      source: "cluster.region"
      overridable: true
    - name: "qovery_cluster_name"
      source: "cluster.name"
    - name: "qovery_cluster_id"
      source: "cluster.id"

  variables:
    - name: "instance_name"
      type: "string"
      required: true
      description: "Letters, digits, hyphens, underscores; must start with a letter or digit; max 100 chars."
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]{0,99}$"
      minLength: 1
      maxLength: 100
    - name: "db_name"
      type: "string"
      required: true
      description: "Letters, digits, underscores; must start with a letter; max 64 chars. No hyphens."
      pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,63}$"
      minLength: 1
      maxLength: 64
    - name: "db_username"
      type: "string"
      required: false
      description: "Leave empty to use qoveryadmin. Letters, digits, underscores, starting with a letter, max 32; not rdb_admin or mysql."
      pattern: "^([a-zA-Z][a-zA-Z0-9_]{0,31})?$"
      maxLength: 32
    - name: "db_password"
      type: "string"
      required: false
      sensitive: true
      description: 'Leave empty and Qovery generates a 32-character password. To set your own: 8–128 chars, must not contain /, @, ", or spaces.'
      pattern: '^([^/@" ]+)?$'
      maxLength: 128
    - name: "engine_version"
      type: "string"
      required: false
      default: "MySQL-8"
      description: "MySQL engine version"
      allowedValues:
        - "MySQL-8"
    - name: "node_type"
      type: "string"
      required: true
      default: "DB-DEV-S"
      description: "Scaleway node type"
      allowedValues:
        - "DB-DEV-S"
        - "DB-DEV-M"
        - "DB-DEV-L"
        - "DB-GP-XS"
        - "DB-GP-S"
        - "DB-GP-M"
        - "DB-GP-L"
        - "DB-GP-XL"
    - name: "volume_type"
      type: "string"
      required: false
      default: "lssd"
      description: "Volume backend type (lssd = local SSD; sbs_5k/sbs_15k = block SSD at 5k/15k IOPS)"
      allowedValues:
        - "lssd"
        - "sbs_5k"
        - "sbs_15k"
    - name: "volume_size_gb"
      type: "number"
      required: true
      default: "5"
      description: "GB, 5–10000"
      min: 5
      max: 10000
    - name: "is_ha_cluster"
      type: "bool"
      required: false
      default: "false"
      description: "Enable high availability cluster mode"
    - name: "activate_backups"
      type: "bool"
      required: false
      default: "true"
      description: "Enable automated backups"
    - name: "slow_query_log"
      type: "bool"
      required: false
      default: "true"
      description: "Enable MySQL slow query log via the instance settings"
    - name: "publicly_accessible"
      type: "bool"
      required: false
      default: "false"
      description: "Expose a public endpoint open to acl_allowed_cidr. Turning it off later keeps the endpoint: delete it in the Scaleway console."
    - name: "acl_allowed_cidr"
      type: "string"
      required: false
      default: "0.0.0.0/0"
      description: "Single CIDR, only used when publicly_accessible is true, and then not 0.0.0.0/0. Use the Scaleway console for multi-CIDR allowlists."
      pattern: "^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])/(3[0-2]|[12]?[0-9])$"

  outputs:
    - name: "endpoint_ip"
      description: "Public endpoint IP when publicly_accessible, else the private network one"
    - name: "endpoint_port"
      description: "Public endpoint port when publicly_accessible, else the private network one"
    - name: "private_endpoint_ip"
      description: "Database IP on the cluster's private network"
    - name: "private_endpoint_port"
      description: "Database port on the cluster's private network"
    - name: "db_name"
      description: "Database name"
    - name: "db_username"
      description: "Database username"
    - name: "db_password"
      description: "Database user password (generated when the input was left empty)"
      sensitive: true
    - name: "instance_id"
      description: "Scaleway RDB instance ID"
    - name: "certificate"
      description: "TLS CA certificate served by the database (PEM). Use for verify-full SSL."
      sensitive: true
