apiVersion: "qovery.com/v1"
kind: ServiceBlueprint

metadata:
  name: "temporal-cloud-namespace"
  version: "1.0.2"
  description: "Provision a Temporal Cloud namespace (regions, retention, client auth) via the Temporal Cloud Terraform provider"
  icon: "app://qovery-console/temporal"
  serviceFamily: "temporal-cloud"
  categories:
    - "workflow"
    - "temporal"
    - "orchestration"

spec:
  engine:
    type: terraform
    provider: EXTERNAL
    terraform:
      version: "1.9.7"
      allowedValues: ["1.9.7", "1.13.3"]
      overridable: true
    credentials:
      default: env
      allowedValues: ["env"]
      overridable: false
    backend:
      default: qovery
      allowedValues: ["qovery", "user_provided"]
      overridable: true
    timeout: 1800
    resources:
      cpu: "500m"
      ram: "512Mi"

  contextVariables:
    - name: "region"
      source: "cluster.region"
      overridable: true
    - name: "qovery_cluster_name"
      source: "cluster.name"

  variables:
    - name: "temporal_cloud_api_key"
      type: "string"
      required: true
      sensitive: true
      description: "Temporal Cloud API key (used by the provider to manage namespaces)"
    - name: "namespace_name"
      type: "string"
      required: true
      description: "Namespace name (2-64 chars: lowercase letters, digits, hyphens). Temporal appends the account suffix."
      pattern: "^[a-z0-9-]{2,64}$"
    - name: "regions"
      type: "string"
      required: false
      default: "aws-us-east-1"
      description: "Comma-separated Temporal Cloud regions (1-2), e.g. aws-us-east-1 or gcp-us-central1"
    - name: "retention_days"
      type: "number"
      required: false
      default: "30"
      description: "Workflow execution retention period in days (1-90)"
      min: 1
      max: 90
    - name: "accepted_client_ca"
      type: "string"
      required: false
      description: "Base64-encoded PEM CA bundle to additionally enable mTLS client auth. Empty = API-key auth only."

  outputs:
    - name: "namespace_id"
      description: "Full Temporal Cloud namespace id (name.accountId)"
    - name: "namespace_name"
      description: "Namespace name"
    - name: "grpc_endpoint"
      description: "gRPC endpoint for API-key clients"
    - name: "mtls_grpc_endpoint"
      description: "gRPC endpoint for mTLS clients"
