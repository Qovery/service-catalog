apiVersion: "qovery.com/v1"
kind: ServiceBlueprint

metadata:
  name: "aws-bedrock-access"
  displayName: "AWS Bedrock Access"
  primaryCategory: "AI"
  version: "1.0.3"
  description: "Provision scoped AWS Bedrock access — an IAM policy limited to the models you name, plus an optional IAM user with keys — so an application on any cloud (AWS, Azure, Scaleway or GCP) can call Bedrock models"
  icon: "app://qovery-console/bedrock"
  serviceFamily: "bedrock"
  categories:
    - "ai"
    - "llm"
    - "bedrock"

spec:
  engine:
    type: terraform
    provider: EXTERNAL
    terraform:
      version: "1.9.7"
      allowedValues: ["1.9.7", "1.13.3"]
      overridable: true
    credentials:
      default: env
      allowedValues: ["env"]
      overridable: false
    backend:
      default: qovery
      allowedValues: ["qovery", "user_provided"]
      overridable: true
    timeout: 3600
    resources:
      cpu: "500m"
      ram: "512Mi"

  contextVariables:
    - name: "qovery_cluster_name"
      source: "cluster.name"

  variables:
    - name: "aws_access_key_id"
      type: "string"
      required: true
      sensitive: true
      description: "Key of the principal Terraform runs as. Needs IAM write on users, policies and access keys, delete and detach included; see the README."
    - name: "aws_secret_access_key"
      type: "string"
      required: true
      sensitive: true
      description: "Matches aws_access_key_id"
    - name: "aws_region"
      type: "string"
      required: false
      default: "us-east-1"
      description: "Region Bedrock is called in. Model availability differs per region: check yours is offered there."
      pattern: "^[a-z]{2}(-gov)?-[a-z]+-[0-9]$"
    - name: "name_prefix"
      type: "string"
      required: true
      description: "Names the IAM user (<prefix>-bedrock) and its policy (<prefix>-bedrock-invoke). Must be unique within the AWS account."
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,47}$"
    - name: "allowed_model_ids"
      type: "string"
      required: true
      description: "Comma-separated model ids, e.g. anthropic.claude-sonnet-4-5-20250929-v1:0; a cross-region id (us.…) also covers its base model. * allows every model."
    - name: "allow_list_foundation_models"
      type: "bool"
      required: false
      default: "true"
      description: "Also allow read-only discovery calls (List/Get FoundationModel, InferenceProfile), which most SDK samples and model pickers make before invoking."
    - name: "create_iam_user"
      type: "bool"
      required: false
      default: "true"
      description: "Create an IAM user with a long-lived key, needed outside AWS where there is no role to assume. On an AWS cluster, turn off and use attach_to_role_name."
    - name: "attach_to_role_name"
      type: "string"
      required: false
      description: "Unset = attach to nothing. Else an existing IAM role in the account (IRSA, EC2 instance profile) to attach the invoke policy to."

  outputs:
    - name: "aws_region"
      description: "Region the credentials are scoped to call Bedrock in"
    - name: "account_id"
      description: "AWS account the Bedrock access was created in"
    - name: "policy_arn"
      description: "ARN of the Bedrock invoke policy, for attaching to further principals"
    - name: "iam_user_name"
      description: "IAM user holding the invoke policy (empty when create_iam_user is false)"
    - name: "access_key_id"
      description: "Access key id for the created IAM user — set it as AWS_ACCESS_KEY_ID"
      sensitive: true
    - name: "secret_access_key"
      description: "Secret access key for the created IAM user — set it as AWS_SECRET_ACCESS_KEY"
      sensitive: true
    - name: "bedrock_endpoint"
      description: "Bedrock runtime endpoint for the region, built from the partition DNS suffix"
    - name: "allowed_model_arns"
      description: "Model and inference profile ARNs the credentials may invoke"
