apiVersion: "qovery.com/v1"
kind: ServiceBlueprint

metadata:
  name: "aws-bedrock-access"
  version: "1.0.0"
  description: "Provision scoped AWS Bedrock access — an IAM policy, an optional IAM user with keys, and optional invocation logging — so an application on any cloud (AWS, Azure, Scaleway or GCP) can call Bedrock models"
  icon: "app://qovery-console/bedrock"
  serviceFamily: "bedrock"
  categories:
    - "ai"
    - "llm"
    - "bedrock"

spec:
  engine:
    type: terraform
    provider: EXTERNAL
    terraform:
      version: "1.9.7"
      allowedValues: ["1.9.7", "1.13.3"]
      overridable: true
    credentials:
      default: env
      allowedValues: ["env"]
      overridable: false
    backend:
      default: qovery
      allowedValues: ["qovery", "user_provided"]
      overridable: true
    timeout: 3600
    resources:
      cpu: "500m"
      ram: "512Mi"

  contextVariables:
    - name: "qovery_cluster_name"
      source: "cluster.name"

  variables:
    - name: "aws_access_key_id"
      type: "string"
      required: true
      sensitive: true
      description: "Access key id of the AWS principal Terraform authenticates as. Needs IAM write access, plus bedrock:* for the optional logging configuration."
    - name: "aws_secret_access_key"
      type: "string"
      required: true
      sensitive: true
      description: "Secret access key matching aws_access_key_id"
    - name: "aws_region"
      type: "string"
      required: false
      default: "us-east-1"
      description: "Region Bedrock is called in. Model availability differs per region — check the model you want is offered there before changing it."
      pattern: "^[a-z]{2}(-gov)?-[a-z]+-[0-9]$"
    - name: "name_prefix"
      type: "string"
      required: true
      description: "Prefix for every resource this blueprint names: the IAM user (<prefix>-bedrock), its policy (<prefix>-bedrock-invoke) and the log group (/aws/bedrock/<prefix>). Must be unique within the AWS account."
      pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,47}$"
    - name: "allowed_model_ids"
      type: "string"
      required: false
      default: "*"
      description: "Comma-separated Bedrock model ids the credentials may invoke, e.g. anthropic.claude-sonnet-4-5-20250929-v1:0. * = every foundation model in the account. A cross-region id (us.anthropic.…) is expanded to both the inference profile and the underlying foundation model."
    - name: "allow_list_foundation_models"
      type: "bool"
      required: false
      default: "true"
      description: "Also allow read-only discovery calls (ListFoundationModels, GetFoundationModel, ListInferenceProfiles, GetInferenceProfile). Most SDK samples and model pickers call these before invoking."
    - name: "create_iam_user"
      type: "bool"
      required: false
      default: "true"
      description: "Create an IAM user with a long-lived access key. This is what makes Bedrock reachable from a cluster outside AWS, which has no IAM role to assume. Set false on an AWS cluster and use attach_to_role_name instead."
    - name: "attach_to_role_name"
      type: "string"
      required: false
      description: "Existing IAM role in the same account to attach the invoke policy to — the keyless path for a workload that already has an AWS identity (IRSA, EC2 instance profile). Unset = attach to nothing."
    - name: "enable_invocation_logging"
      type: "bool"
      required: false
      default: "false"
      description: "Turn on Bedrock model invocation logging to CloudWatch. Off by default because the setting is account-wide per region, not per user: enabling it here overwrites whatever the account already had, and destroying this blueprint removes it for everything else in that region."
    - name: "log_retention_days"
      type: "number"
      required: false
      default: "30"
      description: "Retention of the created log group, in days. 0 = keep forever. Only used when enable_invocation_logging is true."
      allowedValues:
        - "0"
        - "1"
        - "3"
        - "5"
        - "7"
        - "14"
        - "30"
        - "60"
        - "90"
        - "120"
        - "150"
        - "180"
        - "365"
        - "400"
        - "545"
        - "731"
        - "1096"
        - "1827"
        - "2192"
        - "2557"
        - "2922"
        - "3288"
        - "3653"
    - name: "log_text_prompts_and_completions"
      type: "bool"
      required: false
      default: "false"
      description: "Include prompt and completion text in the invocation logs. Off by default: prompts routinely carry user data, and the logs are readable by anyone with CloudWatch access."

  outputs:
    - name: "aws_region"
      description: "Region the credentials are scoped to call Bedrock in"
    - name: "account_id"
      description: "AWS account the Bedrock access was created in"
    - name: "policy_arn"
      description: "ARN of the Bedrock invoke policy, for attaching to further principals"
    - name: "iam_user_name"
      description: "IAM user holding the invoke policy (empty when create_iam_user is false)"
    - name: "access_key_id"
      description: "Access key id for the created IAM user — set it as AWS_ACCESS_KEY_ID"
      sensitive: true
    - name: "secret_access_key"
      description: "Secret access key for the created IAM user — set it as AWS_SECRET_ACCESS_KEY"
      sensitive: true
    - name: "bedrock_endpoint"
      description: "Bedrock runtime endpoint for the region"
    - name: "allowed_model_arns"
      description: "Model and inference profile ARNs the credentials may invoke"
    - name: "log_group_name"
      description: "CloudWatch log group receiving invocation logs (empty when logging is off)"
